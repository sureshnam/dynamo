name: XPU CI Pipeline (Intel GPU)

on:
  push:
    branches:
      - main
      - 'xpu-ci-*'
  pull_request:
    paths:
      - 'container/**'
      - 'components/**'
      - 'lib/**'
      - 'examples/backends/vllm/launch/xpu/**'
      - '.github/workflows/xpu-ci.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'HuggingFace model to test'
        required: false
        default: 'Qwen/Qwen3-0.6B'
      skip_build:
        description: 'Skip container build (reuse existing image)'
        required: false
        type: boolean
        default: false

concurrency:
  group: xpu-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  XPU_IMAGE_TAG: dynamo-vllm-xpu:${{ github.sha }}
  XPU_TEST_IMAGE_TAG: dynamo-vllm-xpu-test:${{ github.sha }}
  MODEL: ${{ github.event.inputs.model || 'Qwen/Qwen3-0.6B' }}

jobs:
  # ============================================================================
  # VALIDATE INTEL GPU HARDWARE
  # ============================================================================
  hw-check:
    name: Validate Intel GPU hardware
    runs-on: [self-hosted, xpu, intel-b70]
    outputs:
      xpu_docker_env: ${{ steps.detect-gpu.outputs.xpu_docker_env }}
      xpu_docker_groups: ${{ steps.detect-gpu.outputs.xpu_docker_groups }}
      gpu_type: ${{ steps.detect-gpu.outputs.gpu_type }}
    steps:
      - name: Check Intel GPU availability and detect type
        id: detect-gpu
        run: |
          echo "=== Intel GPU Discovery ==="
          # Use lspci (always available) to detect Intel GPUs
          if command -v lspci &>/dev/null; then
            lspci | grep -iE 'VGA|Display|3D' || true
          fi
          echo ""
          echo "=== DRI Devices ==="
          ls -la /dev/dri/
          echo ""

          # Count render devices as GPU count
          GPU_COUNT=$(ls /dev/dri/renderD* 2>/dev/null | wc -l)
          echo "Found ${GPU_COUNT} Intel GPU render device(s)"
          if [ "$GPU_COUNT" -lt 1 ]; then
            echo "ERROR: No Intel GPU render devices detected"
            exit 1
          fi

          # Detect GPU model — try multiple methods
          GPU_NAME=""
          if command -v xpu-smi &>/dev/null; then
            GPU_NAME=$(xpu-smi discovery 2>/dev/null | grep "Device Name" | head -1 | sed 's/.*: *//')
          fi
          if [ -z "$GPU_NAME" ] && command -v lspci &>/dev/null; then
            GPU_NAME=$(lspci | grep -iE 'VGA|Display|3D' | grep -i intel | head -1 | sed 's/.*: //')
          fi
          if [ -z "$GPU_NAME" ]; then
            # Fallback: read PCI device ID from sysfs
            for card in /sys/class/drm/card*/device; do
              if [ -f "$card/vendor" ]; then
                VENDOR=$(cat "$card/vendor" 2>/dev/null)
                DEVICE_ID=$(cat "$card/device" 2>/dev/null)
                if [ "$VENDOR" = "0x8086" ]; then
                  GPU_NAME="Intel GPU PCI device ${DEVICE_ID}"
                  # B580 = 0xe20b, B570 = 0xe20c
                  break
                fi
              fi
            done
          fi
          echo "Detected GPU: ${GPU_NAME}"

          # Consumer Arc GPUs (B580, A770, etc.) need the V1 Level Zero UR adapter
          # Data center GPUs (B70, Max series) work with the default V2 adapter
          DOCKER_ENV=""
          # Match by name or PCI device ID (B580=0xe20b, B570=0xe20c, A770=0x5690, A750=0x5694)
          if echo "${GPU_NAME}" | grep -qiE 'B580|A770|A750|A580|B570|0xe20b|0xe20c|0x5690|0x5694'; then
            echo "Consumer Arc GPU detected — forcing Level Zero V1 UR adapter"
            DOCKER_ENV="-e UR_ADAPTERS_FORCE_LOAD=/opt/dynamo/venv/lib/libur_adapter_level_zero.so"
            echo "gpu_type=arc-consumer" >> "$GITHUB_OUTPUT"
          else
            echo "Data center GPU detected — using default V2 UR adapter"
            echo "gpu_type=data-center" >> "$GITHUB_OUTPUT"
          fi
          echo "xpu_docker_env=${DOCKER_ENV}" >> "$GITHUB_OUTPUT"

          # Collect render device group IDs for --group-add (needed inside container
          # so the non-root user can access /dev/dri/renderD* nodes)
          DOCKER_GROUPS=""
          for r in /dev/dri/renderD*; do
            [ -e "$r" ] || continue
            GID=$(stat -c '%g' "$r")
            DOCKER_GROUPS="${DOCKER_GROUPS} --group-add ${GID}"
          done
          # De-duplicate
          DOCKER_GROUPS=$(echo "$DOCKER_GROUPS" | tr ' ' '\n' | awk '!seen[$0]++' | tr '\n' ' ')
          echo "Render group flags: ${DOCKER_GROUPS}"
          echo "xpu_docker_groups=${DOCKER_GROUPS}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # BUILD XPU VLLM CONTAINER
  # ============================================================================
  build-xpu:
    name: Build vLLM XPU image
    needs: [hw-check]
    if: ${{ github.event.inputs.skip_build != 'true' }}
    runs-on: [self-hosted, xpu, intel-b70]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate XPU Dockerfile
        run: |
          python3 container/render.py \
            --framework vllm \
            --device xpu \
            --target runtime \
            --platform linux/amd64 \
            --output-short-filename \
            --show-result

      - name: Build XPU runtime image
        run: |
          docker build \
            --progress=plain \
            --build-arg DYNAMO_COMMIT_SHA=${{ github.sha }} \
            --build-arg http_proxy=${http_proxy:-} \
            --build-arg https_proxy=${https_proxy:-} \
            --build-arg HTTP_PROXY=${HTTP_PROXY:-} \
            --build-arg HTTPS_PROXY=${HTTPS_PROXY:-} \
            --build-arg no_proxy=${no_proxy:-} \
            -f container/rendered.Dockerfile \
            -t ${{ env.XPU_IMAGE_TAG }} \
            .

      - name: Build XPU test image
        run: |
          if [ -f container/Dockerfile.test ]; then
            docker build \
              --progress=plain \
              --build-arg BASE_IMAGE=${{ env.XPU_IMAGE_TAG }} \
              --build-arg http_proxy=${http_proxy:-} \
              --build-arg https_proxy=${https_proxy:-} \
              --build-arg HTTP_PROXY=${HTTP_PROXY:-} \
              --build-arg HTTPS_PROXY=${HTTPS_PROXY:-} \
              --build-arg no_proxy=${no_proxy:-} \
              -f container/Dockerfile.test \
              -t ${{ env.XPU_TEST_IMAGE_TAG }} \
              .
          else
            echo "No Dockerfile.test found, using runtime image for tests"
            docker tag ${{ env.XPU_IMAGE_TAG }} ${{ env.XPU_TEST_IMAGE_TAG }}
          fi

      - name: Verify image
        run: |
          echo "=== Image Info ==="
          docker images ${{ env.XPU_IMAGE_TAG }}
          docker images ${{ env.XPU_TEST_IMAGE_TAG }}

  # ============================================================================
  # XPU SMOKE TEST — Intel GPU detection inside container
  # ============================================================================
  xpu-smoke-test:
    name: XPU smoke test (GPU detection)
    needs: [hw-check, build-xpu]
    if: always() && (needs.build-xpu.result == 'success' || github.event.inputs.skip_build == 'true')
    runs-on: [self-hosted, xpu, intel-b70]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Intel GPU visible inside container
        run: |
          docker run --rm \
            --device /dev/dri \
            -v /dev/dri:/dev/dri \
            ${{ needs.hw-check.outputs.xpu_docker_groups }} \
            ${{ needs.hw-check.outputs.xpu_docker_env }} \
            ${{ env.XPU_IMAGE_TAG }} \
            python3 -c "
          import torch
          print('PyTorch version:', torch.__version__)
          try:
              import intel_extension_for_pytorch as ipex
              print('IPEX version:', ipex.__version__)
          except ImportError:
              print('IPEX: not installed (not required for PyTorch >= 2.10)')
          print('XPU available:', torch.xpu.is_available())
          print('XPU device count:', torch.xpu.device_count())
          for i in range(torch.xpu.device_count()):
              print(f'  Device {i}: {torch.xpu.get_device_name(i)}')
          assert torch.xpu.is_available(), 'XPU not available!'
          assert torch.xpu.device_count() > 0, 'No XPU devices found!'
          # Basic tensor op on XPU
          t = torch.randn(2, 3).to('xpu')
          print('Tensor on XPU:', t.device)
          print('PASS: Intel GPU smoke test')
          "

  # ============================================================================
  # XPU CPU-ONLY TESTS — unit tests that don't need GPU
  # ============================================================================
  xpu-cpu-tests:
    name: XPU CPU-only tests
    needs: [hw-check, build-xpu]
    if: always() && (needs.build-xpu.result == 'success' || github.event.inputs.skip_build == 'true')
    runs-on: [self-hosted, xpu, intel-b70]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CPU-only unit tests
        run: |
          mkdir -p test-results
          # Container runs as non-root 'dynamo' user; make mount writable for it
          chmod 777 test-results

          docker run --rm \
            -w /workspace \
            --shm-size=200m \
            --network host \
            -v "$(pwd)/test-results:/workspace/test-results" \
            -e VLLM_TARGET_DEVICE=xpu \
            ${{ env.XPU_TEST_IMAGE_TAG }} \
            sh -c "
              pytest -v --tb=short \
                --junitxml=/workspace/test-results/xpu-cpu-tests.xml \
                --durations=10 \
                -m 'vllm and gpu_0' \
                || true
            "

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xpu-cpu-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  # ============================================================================
  # XPU SINGLE-GPU INFERENCE TEST — vLLM serving on 1 Intel GPU
  # ============================================================================
  xpu-single-gpu-test:
    name: XPU single-GPU inference test
    needs: [hw-check, xpu-smoke-test]
    runs-on: [self-hosted, xpu, intel-b70]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run vLLM XPU inference test
        run: |
          mkdir -p test-results
          chmod 777 test-results

          docker run --rm \
            --device /dev/dri \
            -v /dev/dri:/dev/dri \
            --shm-size=200m \
            --network host \
            -e VLLM_TARGET_DEVICE=xpu \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -e http_proxy="${http_proxy:-}" \
            -e https_proxy="${https_proxy:-}" \
            -e HTTP_PROXY="${HTTP_PROXY:-}" \
            -e HTTPS_PROXY="${HTTPS_PROXY:-}" \
            -e no_proxy="${no_proxy:-localhost,127.0.0.1}" \
            -e NO_PROXY="${NO_PROXY:-localhost,127.0.0.1}" \
            ${{ needs.hw-check.outputs.xpu_docker_groups }} \
            ${{ needs.hw-check.outputs.xpu_docker_env }} \
            -v "$(pwd)/test-results:/workspace/test-results" \
            ${{ env.XPU_IMAGE_TAG }} \
            python3 -c "
          from vllm import LLM, SamplingParams

          print('=== vLLM XPU Single-GPU Inference Test ===')
          print('Loading model: ${{ env.MODEL }}')

          # Note: 'device' kwarg removed in newer vLLM — device is auto-detected
          # from the build (VLLM_TARGET_DEVICE=xpu set in env)
          llm = LLM(
              model='${{ env.MODEL }}',
              enforce_eager=True,
              max_model_len=512,
              max_num_seqs=2,
          )

          prompts = [
              'Hello, my name is',
              'The capital of France is',
          ]
          sampling_params = SamplingParams(temperature=0.8, top_p=0.95, max_tokens=32)

          outputs = llm.generate(prompts, sampling_params)
          for output in outputs:
              prompt = output.prompt
              generated = output.outputs[0].text
              print(f'Prompt: {prompt!r}')
              print(f'Generated: {generated!r}')
              print()

          print('PASS: vLLM XPU inference test completed successfully')
          "

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xpu-gpu-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  # ============================================================================
  # XPU DYNAMO AGG SERVING TEST — full Dynamo aggregated pipeline
  # ============================================================================
  xpu-dynamo-agg-test:
    name: XPU Dynamo aggregated serving test
    needs: [hw-check, xpu-single-gpu-test]
    runs-on: [self-hosted, xpu, intel-b70]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Dynamo aggregated serving on XPU
        run: |
          CONTAINER_NAME="dynamo-xpu-agg-test-${{ github.run_id }}"

          # Start Dynamo aggregated serving in the background
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --device /dev/dri \
            -v /dev/dri:/dev/dri \
            --shm-size=200m \
            --network host \
            -e VLLM_TARGET_DEVICE=xpu \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -e http_proxy="${http_proxy:-}" \
            -e https_proxy="${https_proxy:-}" \
            -e HTTP_PROXY="${HTTP_PROXY:-}" \
            -e HTTPS_PROXY="${HTTPS_PROXY:-}" \
            -e no_proxy="${no_proxy:-localhost,127.0.0.1}" \
            -e NO_PROXY="${NO_PROXY:-localhost,127.0.0.1}" \
            ${{ needs.hw-check.outputs.xpu_docker_groups }} \
            ${{ needs.hw-check.outputs.xpu_docker_env }} \
            -w /workspace \
            ${{ env.XPU_IMAGE_TAG }} \
            bash -c "
              export VLLM_TARGET_DEVICE=xpu

              # Start etcd (Dynamo's discovery backend)
              /usr/local/bin/etcd/etcd \
                --listen-client-urls http://127.0.0.1:2379 \
                --advertise-client-urls http://127.0.0.1:2379 \
                --data-dir /tmp/etcd-data \
                > /tmp/etcd.log 2>&1 &
              ETCD_PID=\$!

              # Start NATS (Dynamo's message bus)
              /usr/bin/nats-server -js > /tmp/nats.log 2>&1 &
              NATS_PID=\$!

              # Wait for etcd to be ready
              for i in \$(seq 1 30); do
                if curl -sf http://127.0.0.1:2379/health > /dev/null 2>&1; then
                  echo 'etcd is ready'
                  break
                fi
                sleep 1
              done

              python -m dynamo.frontend &
              DYN_SYSTEM_PORT=8081 python -m dynamo.vllm \
                --model ${{ env.MODEL }} \
                --enforce-eager \
                --max-model-len 512 \
                --max-num-seqs 2 \
                --block-size 64 &
              wait -n
            "

          # Wait for the model to actually be registered (not just frontend up).
          # /v1/models returns {"data":[]} until the vLLM worker is fully loaded.
          echo "Waiting for Dynamo model to be registered (up to 600s)..."
          READY=false
          for i in $(seq 1 600); do
            MODELS_JSON=$(curl -sf http://localhost:8000/v1/models 2>/dev/null || echo "")
            if [ -n "$MODELS_JSON" ] && echo "$MODELS_JSON" | grep -q '"id"'; then
              echo "Dynamo model is ready after ${i}s"
              echo "Models response: ${MODELS_JSON}"
              READY=true
              break
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "Still waiting... (${i}s elapsed)"
            fi
            sleep 1
          done

          if [ "$READY" = "false" ]; then
            echo "ERROR: Dynamo model did not register in time"
            echo "=== Container Logs ==="
            docker logs "${CONTAINER_NAME}" 2>&1 | tail -200
            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
            exit 1
          fi

          # Send a test request with retries
          echo "Sending test inference request..."
          RESPONSE=""
          for i in $(seq 1 5); do
            RESPONSE=$(curl -sf http://localhost:8000/v1/completions \
              -H "Content-Type: application/json" \
              -d '{
                "model": "${{ env.MODEL }}",
                "prompt": "Hello, world",
                "max_tokens": 16
              }' 2>&1) || true
            if [ -n "$RESPONSE" ] && echo "$RESPONSE" | grep -q '"choices"'; then
              break
            fi
            echo "Attempt ${i} failed, retrying in 5s..."
            sleep 5
          done

          echo "Response: ${RESPONSE}"

          if echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'choices' in d" 2>/dev/null; then
            echo "PASS: Dynamo aggregated serving test"
            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
          else
            echo "FAIL: Response validation failed"
            echo "=== Container Logs (last 200 lines) ==="
            docker logs "${CONTAINER_NAME}" 2>&1 | tail -200
            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
            exit 1
          fi

  # ============================================================================
  # NOTIFY ON FAILURE
  # ============================================================================
  notify-failure:
    name: Report XPU CI status
    runs-on: [self-hosted, xpu, intel-b70]
    if: always() && failure()
    needs: [xpu-smoke-test, xpu-cpu-tests, xpu-single-gpu-test, xpu-dynamo-agg-test]
    steps:
      - name: Report failure
        run: |
          echo "::error::XPU CI pipeline failed. Check individual job logs for details."
          echo "Failed jobs in run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
